{% import "macros.html" as m %}
{% import "icons.html" as ic %}
{{ m.notice(notice) }}
{% if cards %}
<div class="grid grid-4">
  {% for c in cards %}
  <div class="card stat stat-{{ c.status }}">
    <span class="stat-icon">{{ ic.icon(c.icon) }}</span>
    <div class="stat-body">
      <span class="help stat-label" data-help="{{ c.help }}" tabindex="0">{{ c.label }}</span>
      <strong class="stat-value">{{ c.count }}</strong>
    </div>
  </div>
  {% endfor %}
  <a class="card stat stat-pending{% if pending %} stat-attention{% endif %}" href="/approvals">
    <span class="stat-icon">{{ ic.icon("bell") }}</span>
    <div class="stat-body">
      <span class="help stat-label" data-help="Risky actions waiting for a person to approve or deny them." tabindex="0">Waiting for a human</span>
      <strong class="stat-value">{{ pending if pending is not none else "–" }}</strong>
    </div>
  </a>
</div>
{% endif %}
