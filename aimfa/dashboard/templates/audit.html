{% extends "base.html" %}
{% import "icons.html" as ic %}
{% block content %}
<div class="toolbar">
  <button class="btn btn-primary" type="button" data-fetch="/audit/verify" data-target="verify-result"
          data-help="Re-check every entry's fingerprint and make sure it still links to the one before it. Any secret edit shows up here.">{{ ic.icon("shield-check") }}Check nothing was tampered with</button>
  <div id="verify-result" class="verify-result"></div>
</div>
<p class="note">Newest entries at the top. Updates live.</p>
<section class="live" data-src="/partials/audit" data-every="{{ refresh_ms }}">
  {% include "partials/audit.html" %}
</section>
{% endblock %}
