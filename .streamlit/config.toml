# Dashboard theme. Streamlit reads this from the folder it is started in (the repo root;
# scripts/run_demo.py starts it there). Server settings stay on the command line.
# Palette follows design/decision-console.html: cool grey ground, white cards, steel blue.

[theme]
base = "light"
primaryColor = "#1f6f9e"
backgroundColor = "#eef1f5"
secondaryBackgroundColor = "#e2e7ee"
textColor = "#141821"
linkColor = "#1f6f9e"
borderColor = "#d4d9e2"
showWidgetBorder = true
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
codeBackgroundColor = "#f7f9fb"
dataframeHeaderBackgroundColor = "#e2eef5"
dataframeBorderColor = "#d4d9e2"
greenColor = "#1f7a52"
orangeColor = "#8a5e0f"
redColor = "#ad2f26"
blueColor = "#1f6f9e"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontWeight = 650

[theme.sidebar]
backgroundColor = "#e4e9f0"
secondaryBackgroundColor = "#d9e0ea"
